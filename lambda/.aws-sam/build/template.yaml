AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Media processing pipeline for FlatNFlatmates.in (Sharp image resizing
  & FFmpeg 720p video transcoding)
Parameters:
  ExistingBucketName:
    Type: String
    Description: The name of the existing S3 bucket
    Default: flatnflatmate-dir-dev
  AppUrl:
    Type: String
    Description: Base URL of Next.js application for internal webhooks
    Default: https://flat-n-flatmates.vercel.app
  InternalMediaSecret:
    Type: String
    Description: Shared secret for /api/internal/media/:id/complete callback
    Default: flatnflatmates_internal_media_secret_prod_key_2026
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 900
    Environment:
      Variables:
        APP_URL:
          Ref: AppUrl
        INTERNAL_MEDIA_SECRET:
          Ref: InternalMediaSecret
Resources:
  ProcessImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ProcessImageFunction
      Handler: index.handler
      MemorySize: 1024
      EphemeralStorage:
        Size: 1024
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: ExistingBucketName
    Metadata:
      SamResourceId: ProcessImageFunction
  ImageLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::GetAtt:
        - ProcessImageFunction
        - Arn
      Principal: s3.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:s3:::${ExistingBucketName}
  ProcessVideoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ProcessVideoFunction
      Handler: index.handler
      MemorySize: 2048
      EphemeralStorage:
        Size: 3072
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: ExistingBucketName
    Metadata:
      SamResourceId: ProcessVideoFunction
  VideoLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::GetAtt:
        - ProcessVideoFunction
        - Arn
      Principal: s3.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:s3:::${ExistingBucketName}
Outputs:
  ProcessImageFunctionArn:
    Description: ARN of Image Processor Lambda
    Value:
      Fn::GetAtt:
      - ProcessImageFunction
      - Arn
  ProcessVideoFunctionArn:
    Description: ARN of Video Processor Lambda
    Value:
      Fn::GetAtt:
      - ProcessVideoFunction
      - Arn
